<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Three bundle smoke test</title>
<style>
  html,body{margin:0;height:100%;background:#05070c;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #err{position:fixed;left:16px;top:16px;color:#ff6b6b;font:14px monospace;white-space:pre-wrap;z-index:9}
</style>
</head>
<body>
<div id="err"></div>
<script src="../vendor/three.bundle.js"></script>
<script>
window.addEventListener('error', (e) => { document.getElementById('err').textContent += e.message + '\n'; });
try {
  const T = window.THREE;
  const renderer = new T.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.outputColorSpace = T.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);
  const scene = new T.Scene();
  scene.background = new T.Color(0x05070c);
  const camera = new T.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(3, 2.4, 4);
  const controls = new T.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0);
  scene.add(new T.HemisphereLight(0x9edfff, 0x0a1b33, 2.5));
  const key = new T.DirectionalLight(0xffffff, 4);
  key.position.set(4, 6, 5);
  scene.add(key);
  const cube = new T.Mesh(
    new T.BoxGeometry(1.6, 1.6, 1.6, 4, 4, 4),
    new T.MeshPhysicalMaterial({ color: 0x1b2735, metalness: 0.8, roughness: 0.22, emissive: 0x1d6f8a, emissiveIntensity: 0.4 })
  );
  scene.add(cube);
  const glow = new T.Mesh(
    new T.SphereGeometry(0.08, 16, 16),
    new T.MeshBasicMaterial({ color: 0x68f4ff })
  );
  glow.position.set(1.7, 0.7, 0);
  scene.add(glow);
  const composer = new T.EffectComposer(renderer);
  composer.addPass(new T.RenderPass(scene, camera));
  const bloom = new T.UnrealBloomPass(new T.Vector2(innerWidth, innerHeight), 0.65, 0.4, 0.85);
  composer.addPass(bloom);
  composer.addPass(new T.OutputPass());
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
  });
  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.016;
    cube.rotation.x = 0.3 + t * 0.4;
    cube.rotation.y = t * 0.55;
    composer.render();
  }
  animate();
  window.__TEST_OK__ = true;
} catch (e) {
  document.getElementById('err').textContent = 'ERROR: ' + e.stack;
  console.error(e);
}
</script>
</body>
</html>
