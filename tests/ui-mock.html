<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Action4 UI Mock — Teardown Lab / 01</title>
<link rel="stylesheet" href="../src/ui.css" />
<style>
  /* ---- offline mock stage only (not part of the shipping page) ---- */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020509;
    color: #cfe3ec;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }

  #scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
      radial-gradient(900px 560px at 50% 42%, rgba(24, 78, 98, 0.55), transparent 64%),
      radial-gradient(620px 420px at 72% 82%, rgba(96, 58, 20, 0.22), transparent 70%),
      linear-gradient(180deg, #050b12 0%, #02060a 68%, #010306 100%);
  }

  #scene::before {
    content: "";
    position: absolute;
    inset: -25% -20%;
    background-image:
      linear-gradient(rgba(95, 232, 255, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(95, 232, 255, 0.06) 1px, transparent 1px);
    background-size: 54px 54px;
    transform: perspective(620px) rotateX(63deg) translateY(30%);
    transform-origin: center;
    opacity: 0.65;
  }

  .mock-device {
    position: absolute;
    left: 50%;
    top: 47%;
    width: min(560px, 54vw);
    aspect-ratio: 7.4 / 4.6;
    transform: translate(-50%, -50%);
    border-radius: 26px;
    border: 1px solid rgba(150, 180, 200, 0.14);
    background: linear-gradient(158deg, #1b232c 0%, #0a0f15 58%, #141a21 100%);
    box-shadow:
      0 60px 140px rgba(0, 0, 0, 0.72),
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      inset 0 -18px 40px rgba(0, 0, 0, 0.45);
  }

  .mock-lens {
    position: absolute;
    left: 21%;
    top: 50%;
    width: 36%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 4px solid #2b333c;
    background: radial-gradient(circle at 38% 32%, #101a22, #000 58%);
    box-shadow:
      0 0 0 8px #171d24,
      0 0 0 9px rgba(255, 180, 74, 0.35),
      0 0 70px rgba(95, 232, 255, 0.16),
      inset 0 0 30px #000;
  }

  .mock-lens::after {
    content: "";
    position: absolute;
    inset: 17%;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, rgba(140, 230, 255, 0.55), rgba(10, 40, 60, 0.9) 38%, #000 74%);
    box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.9);
  }

  .mock-screen {
    position: absolute;
    right: 9%;
    top: 50%;
    width: 31%;
    aspect-ratio: 1.62;
    transform: translateY(-50%);
    border-radius: 4px;
    border: 1px solid rgba(95, 232, 255, 0.28);
    background:
      linear-gradient(180deg, rgba(20, 74, 84, 0.92), rgba(4, 18, 24, 0.96));
    box-shadow: 0 0 26px rgba(95, 232, 255, 0.13), inset 0 0 18px rgba(0, 0, 0, 0.6);
  }

  .mock-screen::before {
    content: "";
    position: absolute;
    left: 10%;
    right: 10%;
    top: 22%;
    height: 1px;
    background: rgba(95, 232, 255, 0.5);
    box-shadow: 0 12px 0 rgba(95, 232, 255, 0.22), 0 24px 0 rgba(95, 232, 255, 0.12);
  }

  .mock-caption {
    position: absolute;
    left: 50%;
    bottom: 22%;
    transform: translateX(-50%);
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(150, 190, 205, 0.38);
    white-space: nowrap;
  }

  .mock-hover {
    position: absolute;
    left: 50%;
    top: 82px;
    transform: translateX(-50%);
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    color: rgba(160, 220, 235, 0.55);
    white-space: nowrap;
    pointer-events: none;
  }

  .mock-note {
    position: absolute;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 8px;
    letter-spacing: 0.22em;
    color: rgba(130, 160, 175, 0.35);
    white-space: nowrap;
    pointer-events: none;
  }

  @media (max-width: 820px) {
    .mock-device {
      width: min(420px, 82vw);
    }

    .mock-note {
      display: none;
    }
  }
</style>
</head>
<body>
  <!-- fake WebGL stage: the real page renders Three.js here -->
  <div id="scene" aria-hidden="true">
    <div class="mock-device">
      <div class="mock-lens"></div>
      <div class="mock-screen"></div>
    </div>
    <div class="mock-caption">3D VIEWPORT · MOCK STAGE</div>
    <div class="mock-hover" id="mock-hover">HOVER · —</div>
    <div class="mock-note">UI MOCK · NO WEBGL · CALLBACKS WIRED TO CONSOLE</div>
  </div>

  <!-- Lead-provided overlay host -->
  <div id="ui-root"></div>

  <script src="../src/parts-data.js"></script>
  <script src="../src/ui.js"></script>
  <script>
    /* ============================================================
       Offline harness: wires every required callback and simulates
       the Lead's scene state machine. Nothing here ships.
       ============================================================ */
    (function () {
      'use strict';

      var parts = window.ACTION4_PARTS || [];
      var meta = window.ACTION4_META || {};
      var byId = {};
      for (var i = 0; i < parts.length; i++) byId[parts[i].id] = parts[i];

      var detached = {};
      for (var d = 0; d < parts.length; d++) detached[parts[d].id] = false;
      /* core parts are the assembly datum; app.js counts detached parts over the rest */
      var detachable = parts.filter(function (p) { return !p.core; });
      var total = detachable.length || parts.length;
      var animating = false;
      var hoverEl = document.getElementById('mock-hover');
      var timers = [];

      function later(fn, ms) {
        var t = window.setTimeout(fn, ms);
        timers.push(t);
        return t;
      }

      function clearTimers() {
        for (var k = 0; k < timers.length; k++) window.clearTimeout(timers[k]);
        timers = [];
      }

      function count() {
        var n = 0;
        for (var k = 0; k < detachable.length; k++) if (detached[detachable[k].id]) n++;
        return n;
      }

      function label(id) {
        var p = byId[id];
        return p ? p.name + ' / ' + p.en : String(id);
      }

      function log(kind, detail) {
        if (window.console && window.console.log) {
          window.console.log('[mock]', kind, detail === undefined ? '' : detail);
        }
        var logs = window.__mockLogs = window.__mockLogs || [];
        logs.push({ kind: kind, detail: detail, at: Date.now() });
      }

      var ui = window.Action4UI.create({
        parts: parts,
        meta: meta,
        callbacks: {
          onTogglePart: function (id) {
            if (animating) return;
            var part = byId[id];
            log('onTogglePart', { id: id, detached: !detached[id] });
            if (part && part.core) {
              ui.toast(count() === 0 ? '核心中框 · 触发全部拆解' : '核心中框 · 结构基准', 'amber');
              return;
            }
            var target = !detached[id];
            detached[id] = target;
            later(function () {
              ui.setPartDetached(id, target);
              ui.setProgress(count(), total);
              ui.toast((target ? '已拆解 · ' : '已组装 · ') + (part ? part.name : id), target ? 'amber' : 'cyan');
            }, 240);
          },

          onExplodeAll: function () {
            if (animating) return;
            log('onExplodeAll');
            animating = true;
            ui.setBusy(true);
            ui.setSelected(null);
            clearTimers();
            var step = 0;
            (function next() {
              if (step >= detachable.length) {
                ui.setAllDetached(true);
                ui.setProgress(total, total);
                ui.setBusy(false);
                animating = false;
                ui.toast('全部 ' + total + ' 个可拆部件已拆解', 'amber');
                return;
              }
              var part = detachable[step];
              detached[part.id] = true;
              ui.setPartDetached(part.id, true);
              ui.setProgress(step + 1, total);
              step++;
              later(next, 90);
            })();
          },

          onAssembleAll: function () {
            if (animating) return;
            log('onAssembleAll');
            animating = true;
            ui.setBusy(true);
            clearTimers();
            var list = detachable.slice().reverse();
            var step = 0;
            (function next() {
              if (step >= list.length) {
                ui.setAllDetached(false);
                ui.setProgress(0, total);
                ui.setBusy(false);
                animating = false;
                ui.toast('整机已组装完成');
                return;
              }
              detached[list[step].id] = false;
              ui.setPartDetached(list[step].id, false);
              ui.setProgress(total - step - 1, total);
              step++;
              later(next, 75);
            })();
          },

          onResetView: function () {
            log('onResetView');
            ui.toast('视角已重置 · VIEW RESET');
          },

          onToggleAutoRotate: function (on) {
            log('onToggleAutoRotate', on);
            ui.setAutoRotate(on);
            ui.toast(on ? '自动旋转 · ON' : '自动旋转 · OFF');
          },

          onFocusPart: function (id) {
            log('onFocusPart', id);
            if (!id) {
              ui.setSelected(null);
              return;
            }
            ui.setSelected(id, { detached: !!detached[id] });
            ui.toast('定位视角 · ' + label(id));
          },

          onHoverPart: function (id) {
            log('onHoverPart', id);
            hoverEl.textContent = 'HOVER · ' + (id ? label(id) : '—');
          },

          onFullscreen: function () {
            log('onFullscreen');
            ui.toast('全屏回调已触发 · FULLSCREEN');
          },

          onClearSelection: function () {
            log('onClearSelection');
            ui.setSelected(null);
            ui.toast('已返回整机概览');
          }
        }
      });

      window.__ui = ui;

      /* boot sequence mirrors the real page (kept outside `timers` so the
         explode/assemble simulations never cancel the boot reveal) */
      ui.setBusy(true);
      ui.setProgress(0, total);
      window.setTimeout(function () {
        ui.setBusy(false);
        ui.setConnectionState('SCENE ONLINE · MOCK');
        ui.ready();
        ui.toast('UI READY · ' + parts.length + ' 个部件可交互');

        var params = {};
        try {
          var search = window.location.search ? window.location.search.slice(1) : '';
          var pairs = search.split('&');
          for (var p = 0; p < pairs.length; p++) {
            var kv = pairs[p].split('=');
            if (kv[0]) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
          }
        } catch (err) { params = {}; }

        if (params.all === '1') {
          for (var a = 0; a < detachable.length; a++) detached[detachable[a].id] = true;
          ui.setAllDetached(true);
          ui.setProgress(total, total);
        }
        if (params.select && byId[params.select]) {
          ui.setSelected(params.select, { detached: !!detached[params.select] });
        }
        if (params.busy === '1') ui.setBusy(true);
        if (params.hover && byId[params.hover]) {
          ui.setHovered(params.hover);
          hoverEl.textContent = 'HOVER · ' + label(params.hover);
        }
      }, 520);
    })();
  </script>
</body>
</html>
